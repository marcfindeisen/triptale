<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2160" viewBox="0 0 1080 2160">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071123"/>
      <stop offset="70%" stop-color="#0b1f35"/>
      <stop offset="100%" stop-color="#134b8a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
  </defs>

  <rect width="1080" height="2160" fill="url(#g)"/>

  <!-- Licht-Effekte -->
  <circle cx="200" cy="350" r="260" fill="#5b8cff" opacity=".18" filter="url(#blur)"/>
  <circle cx="900" cy="1600" r="320" fill="#38e7ff" opacity=".15" filter="url(#blur)"/>

  <!-- Logo -->
  <g transform="translate(540,900)">
    <circle r="170" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <image href="/icons/triptale-globe-192.png" x="-96" y="-96" width="192" height="192" />
  </g>

  <!-- Schrift -->
  <text x="540" y="1235" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="56" fill="#eaf5ff" opacity=".96">TripTale</text>

  <text x="540" y="1295" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="24" fill="#a8b7d1" opacity=".85">Your Journey. Your Story.</text>
</svg>
