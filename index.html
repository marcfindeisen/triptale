<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f35" />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>TripTale — Your Journey. Your Story.</title>

    <!-- Splashscreen -->
    <style>
      :root {
        --bg1: #071123;
        --bg2: #0b1f35;
        --bg3: #134b8a;
        --fg:  #eaf5ff;
        --muted: #a8b7d1;
      }
      html, body { height: 100%; margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
      .splash {
        position: fixed; inset: 0;
        min-height: 100dvh;
        background:
          radial-gradient(1200px 600px at 85% 90%, rgba(56,231,255,.15), transparent 60%),
          radial-gradient(1000px 500px at 20% 10%, rgba(91,140,255,.18), transparent 60%),
          linear-gradient(180deg, var(--bg1), var(--bg2) 70%, var(--bg3));
        display: grid; place-items: center;
        z-index: 9999; opacity: 1;
        transition: opacity .9s ease;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .splash.hide { opacity: 0; pointer-events: none; }
      .splash-inner {
        text-align: center;
        width: min(90vw, 520px);
      }
      .splash-logo {
        width: clamp(96px, 22vw, 168px);
        height: clamp(96px, 22vw, 168px);
        object-fit: contain;
        display: block;
        margin: 0 auto 16px auto;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,.35));
      }
      .splash-title {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
        font-weight: 700;
        font-size: clamp(20px, 4.8vw, 40px);
        letter-spacing: .2px;
        color: var(--fg);
      }
      .splash-sub {
        margin: 6px 0 0 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
        font-weight: 500;
        font-size: clamp(12px, 2.8vw, 18px);
        color: var(--muted);
      }
      @media (max-height: 560px) {
        .splash-sub { display: none; }
      }
    </style>
  </head>

  <body>
    <!-- Splashscreen -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-inner">
        <img class="splash-logo" src="/icons/triptale-globe-512.png" alt="TripTale Logo" />
        <h1 class="splash-title">TripTale</h1>
        <p class="splash-sub">Your Journey. Your Story.</p>
      </div>
    </div>

    <!-- React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
