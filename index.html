<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f35" />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>TripTale — Your Journey. Your Story.</title>

    <!-- Splashscreen -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        background: #0b1f35 url('/splash.svg') center/cover no-repeat;
        display: grid;
        place-items: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      .splash.hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Splash-Screen -->
    <div id="splash" class="splash" aria-hidden="true"></div>

    <!-- React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
